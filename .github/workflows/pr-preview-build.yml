# Builds the PR preview. Runs on `pull_request`, so a fork PR gets a read-only token and no secrets: mkdocs.yml can load
# hooks and plugins (arbitrary Python), so PR code must never run with write access. The built site and the PR number
# are uploaded as an artifact; pr-preview-deploy.yml publishes it without running any PR code.
name: PR Preview Build

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material mkdocs-video mkdocs-redirects

      - name: Build MkDocs site
        run: mkdocs build --site-dir preview/site

      - name: Record PR number
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "$PR_NUMBER" > preview/pr-number

      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: pr-preview
          path: preview/
          retention-days: 3
